<!DOCTYPE html>
<html>
<head>
    <title>Phone Lookup</title>
    <style>
        body {
            background: #000;
            color: #00ff00;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #111;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #00ff00;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        input {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #00ff00;
            background: #000;
            color: #fff;
            border-radius: 5px;
            margin: 10px 0;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #00cc00;
        }
        pre {
            text-align: left;
            background: #000;
            padding: 15px;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>📱 PHONE LOOKUP</h2>
        <input type="text" id="number" placeholder="Number daalo..." />
        <br>
        <button onclick="lookup()">Search Karo</button>
        <br><br>
        <div id="result">
            <p>Result yahan dikhega...</p>
        </div>
    </div>

    <script>
        async function lookup() {
            const number = document.getElementById("number").value;
            if (!number) {
                alert("Pehle number daalo!");
                return;
            }
            
            document.getElementById("result").innerHTML = "<p>Loading...</p>";
            
            try {
                const response = await fetch(`https://tracexdata-api.onrender.com/api/user-lookup?service=phone&query=${number}`);
                const data = await response.json();
                document.getElementById("result").innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch(e) {
                document.getElementById("result").innerHTML = "<p style='color:red;'>Error: Data nahi mila</p>";
            }
        }
    </script>
</body>
</html>
