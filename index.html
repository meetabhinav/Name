<script>
async function lookup() {
    const number = window.location.search.split("number=")[1];
    if(!number) {
        document.body.innerHTML = "<h2 style='color:white;font-family:Arial;'>Number daalo: ?number=9876543210</h2>";
        return;
    }
    
    document.body.innerHTML = "<p style='color:#00ff00;'>Loading...</p>";
    
    try {
        const response = await fetch(`https://tracexdata-api.onrender.com/api/user-lookup?service=phone&query=${number}`);
        const data = await response.json();
        document.body.innerHTML = `<pre style="color:#00ff00;background:#000;padding:20px;font-size:14px;">${JSON.stringify(data, null, 2)}</pre>`;
    } catch(e) {
        document.body.innerHTML = "<p style='color:red;'>Error: Data nahi mila</p>";
    }
}
lookup();
</script>
